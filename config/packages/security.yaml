# config/packages/security.yaml
security:
    # --- 1. Наш User Entity ---
    providers:
        app_user_provider:
            entity:
                class: App\User\Entity\User
                property: email # Мы логинимся по 'email'

    # --- 2. Как хешировать пароли ---
    password_hashers:
        App\User\Entity\User: 'auto'

    # --- 3. Главная логика: ФАЙРВОЛЫ ---
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # ПУБЛИЧНЫЙ ФАЙРВОЛ (для логина и регистрации)
        login:
            pattern: ^/api/(login|register)
            stateless: true # Не используем сессии
            json_login:
                check_path: /api/login # <--- ЭТОТ РОУТ "ПЕРЕХВАТИТ" JWT-БАНДЛ
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # ЗАЩИЩЕННЫЙ ФАЙРВОЛ (для всего остального API)
        api:
            pattern: ^/api
            stateless: true
            jwt: ~ # <--- Говорим: "Этот файрвол требует JWT-токен"

    # --- 4. Правила доступа ---
    access_control:
        - { path: ^/api/(login|register), roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY } # <--- Все остальное в /api - только по токену

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
