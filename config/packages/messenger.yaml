framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

            # 'async' - это имя нашей асинхронной очереди
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            
            # Scheduler transport для периодических задач
            scheduler: 'doctrine://default?queue_name=scheduler'

        routing:
            # Говорим, что "События" из App\User\Event\*
            # должны отправляться в очередь 'async' (а не выполняться сразу)
            'App\User\Event\UserRegisteredEvent': async
            'App\User\Event\AccreditationSubmittedEvent': async
            
            # Cleanup tasks в scheduler
            'App\Upload\Message\CleanupTemporaryUploadsMessage': scheduler

